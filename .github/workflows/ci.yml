# The gate every pull request has to pass. It exists to enforce three things that
# were previously only habits: the committed lock files actually resolve, the
# build holds at zero warnings, and the web app is really inside the backend.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# A second push to the same branch makes the first run's answer worthless, and
# Windows minutes bill at twice the Linux rate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows and not Linux because Flux.App targets a Windows framework, reaches
    # WASAPI and WinRT MIDI through it, and grows a WinForms shell later. Building
    # that TFM on Linux needs EnableWindowsTargeting and would then run the tests
    # on the one platform the app never ships to.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The frontend runs first because the build is two steps in a fixed order:
      # Vite writes into src/Flux.Web.Server/wwwroot, then the .NET build copies
      # it along. A pipeline without this half builds green and produces a
      # backend with no web app in it, which is worse than having no pipeline at
      # all.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Flux.Web.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Flux.Web.Frontend
        run: npm ci

      # svelte-check is the frontend's only type gate.
      - name: Check frontend types
        working-directory: src/Flux.Web.Frontend
        run: npm run check

      - name: Test frontend
        working-directory: src/Flux.Web.Frontend
        run: npm test

      - name: Build frontend
        working-directory: src/Flux.Web.Frontend
        run: npm run build

      # The content glob that carries wwwroot into the backend is conditional on
      # the folder existing, so an empty one fails silently. Naming the entry
      # point rather than the folder also catches a build that wrote only assets.
      - name: Verify the web app reached the backend
        shell: bash
        run: test -f src/Flux.Web.Server/wwwroot/index.html

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The lock files are committed precisely so a restore cannot quietly resolve
      # something other than what was reviewed. This is the only place that rule
      # is enforced rather than merely intended.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -warnaserror

      # The test projects are xunit v3 executables on Microsoft.Testing.Platform,
      # where a solution-level dotnet test reports zero tests and passes. Running
      # each project directly is the only invocation that actually runs anything.
      - name: Test Flux.Beat
        run: dotnet run --no-build --project tests/Flux.Beat.Tests

      # Nothing here opens a device: the runner has no sound card, and the parts
      # worth testing are the format conversion, the ring buffer, the meter and
      # the device choice, all of which are pure by design.
      - name: Test Flux.Audio
        run: dotnet run --no-build --project tests/Flux.Audio.Tests

      # Nothing here opens a MIDI port either: the parser and the per-deck
      # audibility model are pure, and the port plumbing around them is verified
      # with a controller on the desk because there is no other way.
      - name: Test Flux.Midi
        run: dotnet run --no-build --project tests/Flux.Midi.Tests

      - name: Test Flux.Web.Server
        run: dotnet run --no-build --project tests/Flux.Web.Server.Tests

      # Nothing here reaches a bridge: the fakes stand in for it, and the light engine
      # is tested through the colours it returns.
      - name: Test Flux.Hue
        run: dotnet run --no-build --project tests/Flux.Hue.Tests

      # Nothing here reads rekordbox: the chain walker is tested against memory the
      # tests lay out, and the one test that attaches to a real rekordbox skips here.
      - name: Test Flux.Rekordbox
        run: dotnet run --no-build --project tests/Flux.Rekordbox.Tests

      # Nothing here opens a window, a WebView2 or a console: the launch flag and the
      # log's retention are what the shell decides, and the rest is verified by use.
      - name: Test Flux.App
        run: dotnet run --no-build --project tests/Flux.App.Tests
